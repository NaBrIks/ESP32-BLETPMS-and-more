[platformio]
default_envs = s3-lcd7

[env]
platform = espressif32@8.0.0
platform_packages =
    framework-espidf @ symlink://${platformio.packages_dir}/framework-espidf-v5.5.6
    platformio/toolchain-riscv32-esp@14.2.0+20260121
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
framework = espidf
; NaWFstore is registered through ESP-IDF CMake, not the Arduino-style LDF.
lib_ignore = NaWFstore
monitor_speed = 115200
upload_speed = 921600
build_flags = -std=gnu++20
build_unflags = -std=gnu++2b
board_build.embed_txtfiles =
    src/www/index.html
    src/www/ble.html
    src/www/css.css
board_build.embed_files =
    src/ui/project.cbor
    src/ui/appearance.cbor

[env:lilygo-t-display-s3]
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.lilygo-t-display-s3
board = lilygo-t-display-s3
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DAPP_BOARD=lilygo

[env:s3-lcd7]
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.s3-lcd7
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DAPP_BOARD=lcd7

[env:s3-headless]
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.s3-headless
board = esp32-s3-devkitc-1
board_build.partitions = partitions.headless.csv
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.cmake_extra_args = -DAPP_BOARD=headless
