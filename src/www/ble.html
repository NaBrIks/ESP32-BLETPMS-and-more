// Vehicle relations only. Instrument identity is never changed by a move.
function assignSensorToWheel(vehicle, sensorId, axleIndex, wheelIndex) {
  const target = vehicle?.axles[axleIndex]?.wheels[wheelIndex];
  if (!sensorId || !target || target.sensor === sensorId) return false;
  let source;
  for (const axle of vehicle.axles)
    for (const wheel of axle.wheels)
      if (wheel.sensor === sensorId) source = wheel;
  const displaced = target.sensor;
  target.sensor = sensorId;
  if (source) source.sensor = displaced;
  return true;
}

// Application component: a TPMS instrument, independent of any wheel position.

class TpmsSensor extends HTMLElement {

 update(){if(!this.button||!this._model)return;const m=this._model;this.dataset.sensorId=m.id;this.button.draggable=!m.readOnly;this.button.tabIndex=m.readOnly?-1:0;this.toggleAttribute("data-readonly",!!m.readOnly);this.toggleAttribute("data-hide-age",!!m.hideAge);this.button.classList.toggle('pressure-changed',!!m.changed);this.button.classList.toggle('sensor-selected',!!m.selected);this.button.setAttribute('aria-pressed',String(!!m.selected));this.button.setAttribute('aria-label',m.accessible);for(const [key,value]of Object.entries({protocol:m.protocol,transport:m.transport,number:m.number,pressure:m.pressure,tags:m.tags,age:m.age}))this.fields[key].textContent=value;}
}
customElements.define('tpms-sensor',TpmsSensor);
})();

async function wifiPerform(command){
 try{
  const accepted=await api('/api/wifi/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(command)});
  if(!accepted.accepted)throw Error(accepted.error||'wifi_command_failed');
  opState(T('Операция принята'),'pending');
  for(let i=0;i<40;i++){
   await new Promise(r=>setTimeout(r,150));
   const result=await api('/api/wifi/operation?id='+accepted.id);
   if(result.state==='failed')throw Error(result.error||'wifi_command_failed');
   if(result.state==='done'){opState('✓','ok');await loadWifi();loadState();return true;}
  }
  throw Error('wifi_operation_timeout');
 }catch(e){opState(e.message,'error');return false;}
}
