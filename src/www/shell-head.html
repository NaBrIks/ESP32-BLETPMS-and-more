<section class="panel radio-settings"><table><colgroup><col style="width:26%"><col style="width:74%"></colgroup><tbody><tr><th data-i="Экран ESP32"></th><td id="nativeThemes" class="scheme-buttons"></td></tr><tr><th data-i="Сайт"></th><td id="siteThemes" class="scheme-buttons"></td></tr></tbody></table></section>

<script>
